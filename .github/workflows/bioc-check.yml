name: BiocCheck

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bioc-check:
    name: BiocCheck (ubuntu / R devel)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R (Bioconductor devel)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libxml2-dev \
            libpng-dev \
            libtiff5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libcairo2-dev \
            libxt-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libmagick++-dev \
            libarchive-dev \
            libudunits2-dev \
            libgdal-dev \
            libproj-dev \
            gfortran

      - name: Install package dependencies (with caching)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocManager

      - name: Configure BiocManager devel and install Bioc deps
        run: |
          BiocManager::install(version = "devel", update = FALSE, ask = FALSE)
          BiocManager::install(
            c("BiocCheck", "Cardinal", "SpatialExperiment", "EBImage",
              "ProtGenerics", "BiocParallel", "cytomapper", "matter",
              "BiocStyle"),
            version = "devel",
            update  = FALSE,
            ask     = FALSE,
            Ncpus   = 2L
          )
        shell: Rscript {0}

      - name: Build package tarball (no vignettes)
        run: R CMD BUILD --no-build-vignettes .

      - name: Run BiocCheck
        run: |
          pkg_tarball <- list.files(".", pattern = "gutenTAG.*\\.tar\\.gz",
                                    full.names = TRUE)[1]
          BiocCheck::BiocCheck(
            pkg_tarball,
            `new-package`                    = TRUE,
            `no-check-bioc-views`            = FALSE,
            `no-check-coding-practices`      = FALSE,
            `no-check-function-len`          = FALSE,
            `no-check-vignettes`             = TRUE,
            `no.quit.on.nonstandard.workdir` = TRUE
          )
        shell: Rscript {0}

      - name: Upload BiocCheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiocCheck-report
          path: gutenTAG.BiocCheck/
          retention-days: 14
