name: R CMD CHECK

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'bioc-devel', bioc: true }
          - { os: macos-latest,  r: 'release',    bioc: false }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libxml2-dev \
            libpng-dev \
            libtiff5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libcairo2-dev \
            libxt-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libmagick++-dev \
            libarchive-dev \
            libudunits2-dev \
            libgdal-dev \
            libproj-dev \
            gfortran

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install fftw libpng libtiff cairo fontconfig imagemagick@6 udunits

      - name: Install package dependencies (with caching)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocManager

      - name: Configure BiocManager devel
        if: matrix.config.bioc == true
        run: |
          BiocManager::install(version = "devel", update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: Install Bioconductor dependencies
        if: matrix.config.bioc == true
        run: |
          BiocManager::install(
            c("Cardinal", "SpatialExperiment", "EBImage",
              "ProtGenerics", "BiocParallel", "cytomapper", "matter",
              "BiocStyle"),
            version = "devel",
            update  = FALSE,
            ask     = FALSE,
            Ncpus   = 2L
          )
        shell: Rscript {0}

      - name: Run R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error_on: '"warning"'
          upload-snapshots: true

      - name: Upload check results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-${{ matrix.config.os }}-R${{ matrix.config.r }}
          path: check/gutenTAG.Rcheck/
          retention-days: 7
