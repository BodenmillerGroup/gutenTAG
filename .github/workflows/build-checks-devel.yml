name: build-checks-devel

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:devel

    steps:
      - uses: actions/checkout@v2

      - name: Set RENV_PATHS_ROOT
        run: |
          echo "RENV_PATHS_ROOT=${{ runner.temp }}/renv" >> $GITHUB_ENV
        shell: bash {0}

      - name: Install and activate renv
        run: |
          install.packages("renv")
          renv::activate()
        shell: Rscript {0}

      - name: Get R and OS version
        id: get-version
        run: |
          cat("##[set-output name=os-version;]", sessionInfo()$running, "\n", sep = "")
          cat("##[set-output name=r-version;]", R.Version()$version.string, sep = "")
        shell: Rscript {0} 

      # TODO if we want to use it in its current form, it would require renv lock file. do we want that?

      - name: Restore Renv package cache
        uses: actions/cache@v3
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{ inputs.cache-version }}-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{inputs.cache-version }}-

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}        
      
      - name: Install system requirements
        run: |
          apt-get update 
          apt-get install -y --no-install-recommends apt-utils 
          apt-get install -y --no-install-recommends zlib1g-dev libfftw3-dev libxml2-dev libpng-dev libtiff-dev libfontconfig1-dev libcurl4-gnutls-dev libcairo2-dev libssl-dev libxt-dev curl libgdal-dev libproj-dev pandoc pandoc-citeproc libmagick++-dev bzip2
          apt-get install -y libarchive-dev libudunits2-dev
          apt-get clean
          rm -rf /var/lib/apt/ilists/*

      - name: Install dependencies
        run: |
          options(warn = 2)
          install.packages("BiocManager")
          BiocManager::install(version = "devel", update = TRUE, ask = FALSE, force = TRUE)
          BiocManager::install("BiocStyle")
          remotes::install_deps(dependencies = TRUE, repos = BiocManager::repositories(), Ncpu = 2L)
        shell: Rscript {0}
        
      - name: Check
        run: |
          install.packages("rcmdcheck")          
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
        
      - name: BiocCheck
        run: |
          BiocManager::install("BiocCheck")
          BiocCheck::BiocCheck(".")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
        if: always()
